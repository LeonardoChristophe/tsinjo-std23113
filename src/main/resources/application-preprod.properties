# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tsinjo_preprod
spring.datasource.username=preprod_user
spring.datasource.password=preprod_pass

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# Logging Configuration
logging.level.com.hei.tsinjo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


app.feature.payment-validation.mock=true
app.env.name=Preproduction